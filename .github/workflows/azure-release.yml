name: Release Edgebook to Azure

on:
  workflow_call:
    secrets:
      AZURE_CLIENT_ID: {required: true}
      AZURE_TENANT_ID: {required: true}
      AZURE_SUBSCRIPTION_ID: {required: true}
      INTEL_DB_PASSWORD: {required: true}
      BOOK_DB_PASSWORD: {required: true}
      ADMIN_TOKEN: {required: true}

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [intel, book]
    steps:
      - uses: actions/checkout@v4
      - name: Compute the lowercase GHCR image name
        env:
          OWNER: ${{ github.repository_owner }}
          PREFIX: ${{ vars.PREFIX }}
          SERVICE: ${{ matrix.service }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/$PREFIX-$SERVICE:$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: edgebook-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install the Container Apps CLI extension
        run: az extension add -n containerapp --upgrade --only-show-errors
      - name: Update both apps, check their versions and publish the UI
        env:
          PREFIX: ${{ vars.PREFIX }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          UI_STORAGE: ${{ vars.UI_STORAGE }}
          INTEL_DB_PASSWORD: ${{ secrets.INTEL_DB_PASSWORD }}
          BOOK_DB_PASSWORD: ${{ secrets.BOOK_DB_PASSWORD }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: bash scripts/deploy-azure.sh
